<!-- Redirect Banner — stevens.dev -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap");

  .redirect-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0a0a0f 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family:
      "DM Sans",
      -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    animation: bannerSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes bannerSlideIn {
    from {
      transform: translateY(-100%);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .redirect-banner__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6ee7b7;
    box-shadow: 0 0 8px rgba(110, 231, 183, 0.5);
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.6;
      transform: scale(0.85);
    }
  }

  .redirect-banner__text {
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .redirect-banner__link {
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    position: relative;
    transition: color 0.2s ease;
    padding-bottom: 1px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
  }

  .redirect-banner__link:hover {
    color: #6ee7b7;
    border-bottom-color: #6ee7b7;
  }

  .redirect-banner__arrow {
    display: inline-block;
    margin-left: 4px;
    transition: transform 0.2s ease;
    font-size: 13px;
  }

  .redirect-banner__link:hover .redirect-banner__arrow {
    transform: translateX(3px);
  }

  /* Push page content down so it's not hidden behind the fixed banner */
  body {
    padding-top: 48px !important;
  }

  @media (max-width: 480px) {
    .redirect-banner {
      padding: 12px 16px;
      gap: 8px;
    }
    .redirect-banner__text {
      font-size: 13px;
    }
  }
</style>

<div class="redirect-banner" role="banner">
  <span class="redirect-banner__dot" aria-hidden="true"></span>
  <span class="redirect-banner__text">
    BeatleTech is now
    <a href="https://stevens.dev" class="redirect-banner__link">
      stevens.dev<span class="redirect-banner__arrow">&rarr;</span>
    </a>
    still me, fresh look.
  </span>
</div>
